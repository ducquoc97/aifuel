<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="color-scheme" content="light"/>
<title>aifuel - Sign in</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230066CC'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' font-family='system-ui'%3E⛽%3C/text%3E%3C/svg%3E"/>
<link rel="stylesheet" href="/ui/fonts.css"/>
<style>
:root {
  color-scheme: light;
  --accent: #0066cc;
  --accent-hover: #00519f;
  --ink: #1d1d1f;
  --ink-48: #6b6b70;
  --canvas: #ffffff;
  --parchment: #f5f5f7;
  --line: #e0e0e0;
  --err: #a8332a;
  --err-tint: rgba(168,51,42,.10);
  --r-ctl: 8px;
  --r-card: 18px;
  --grid-line: rgba(29,29,31,.035);
}
*, *::before, *::after { box-sizing: border-box }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background:
    linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0 / 28px 28px,
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0 / 28px 28px,
    var(--parchment);
  color: var(--ink);
  font-family: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, sans-serif;
  font-size: 13px;
  line-height: 1.5;
}
.card {
  width: min(360px, calc(100vw - 32px));
  background: var(--canvas);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  padding: 32px 28px 28px;
  box-shadow: 0 1px 2px rgba(29,29,31,.05);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
  font-size: 15px;
  font-weight: 600;
}
.brand-tile {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--accent);
  display: grid;
  place-items: center;
  font-size: 16px;
}
h1 { font-size: 17px; margin: 18px 0 4px; }
.desc { margin: 0 0 20px; color: var(--ink-48); }
label { display: block; font-weight: 500; margin-bottom: 6px; }
input[type="password"] {
  width: 100%;
  padding: 9px 11px;
  font: inherit;
  color: var(--ink);
  background: var(--canvas);
  border: 1px solid var(--line);
  border-radius: var(--r-ctl);
  outline: none;
}
input[type="password"]:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0,102,204,.15);
}
button {
  width: 100%;
  margin-top: 16px;
  padding: 9px 11px;
  font: inherit;
  font-weight: 500;
  color: #fff;
  background: var(--accent);
  border: none;
  border-radius: var(--r-ctl);
  cursor: pointer;
}
button:hover { background: var(--accent-hover); }
button:disabled { opacity: .55; cursor: default; }
.error {
  display: none;
  margin-top: 14px;
  padding: 8px 11px;
  border-radius: var(--r-ctl);
  background: var(--err-tint);
  color: var(--err);
}
.error.shown { display: block; }
.foot { margin-top: 18px; text-align: center; color: var(--ink-48); font-size: 12px; }
</style>
</head>
<body>
<main class="card">
  <div class="brand"><span class="brand-tile" aria-hidden="true">⛽</span> aifuel</div>
  <h1>Sign in</h1>
  <p class="desc">This aifuel dashboard requires the admin password.</p>
  <form id="login-form">
    <label for="password">Admin password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autofocus required/>
    <button id="submit" type="submit">Sign in</button>
    <div class="error" id="error" role="alert"></div>
  </form>
  <p class="foot">aifuel v{{VERSION}}</p>
</main>
<script>
const form = document.getElementById("login-form");
const submit = document.getElementById("submit");
const errorBox = document.getElementById("error");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  errorBox.classList.remove("shown");
  submit.disabled = true;
  try {
    const response = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("password").value }),
    });
    if (response.ok) {
      // The session cookie is set; reload so this same URL serves the
      // real page instead of the sign-in gate.
      window.location.reload();
      return;
    }
    let message = "sign-in failed";
    try {
      const body = await response.json();
      if (body && body.error) message = body.error;
    } catch (_) { /* keep the generic message */ }
    errorBox.textContent = message;
    errorBox.classList.add("shown");
  } catch (_) {
    errorBox.textContent = "could not reach the server";
    errorBox.classList.add("shown");
  } finally {
    submit.disabled = false;
  }
});
</script>
</body>
</html>
