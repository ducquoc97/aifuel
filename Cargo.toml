[workspace]
members = [
    "crates/aifuel-core",
    "crates/aifuel-app",
    "crates/aifuel-providers",
    "crates/aifuel-mcp",
    "crates/aifuel",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
process-wrap = { version = "=8.2.0", features = ["tokio1"] }
rmcp = { version = "=1.6.0", default-features = false, features = ["client", "server", "transport-async-rw"] }
sha2 = "0.11.0"
tiny_http = "0.12.0"
tokio = { version = "1.53.1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
